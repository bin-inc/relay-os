[workspace]
resolver = "3"
members = ["boot", "kernel", "userland/tests", "userland/utils", "userland/sh", "crates/boot-info", "crates/term", "crates/vfs", "crates/shell", "crates/ext2", "crates/usb", "crates/heap", "crates/relay-abi", "crates/crc32", "crates/sysimg", "crates/relay-rt", "crates/elf", "xtask"]
default-members = ["crates/boot-info", "crates/term", "crates/vfs", "crates/shell", "crates/ext2", "crates/usb", "crates/heap", "crates/relay-abi", "crates/crc32", "crates/sysimg", "crates/relay-rt", "crates/elf", "xtask"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
boot-info = { path = "crates/boot-info" }
term = { path = "crates/term" }
vfs = { path = "crates/vfs" }
shell = { path = "crates/shell" }
ext2 = { path = "crates/ext2" }
usb = { path = "crates/usb" }
heap = { path = "crates/heap" }
relay-abi = { path = "crates/relay-abi" }
crc32 = { path = "crates/crc32" }
sysimg = { path = "crates/sysimg" }
relay-rt = { path = "crates/relay-rt" }
elf = { path = "crates/elf" }
uefi = { version = "0.41", default-features = false }
x86_64 = { version = "0.15.5", default-features = false, features = ["instructions"] }
bitflags = "2"
spin = { version = "0.12", default-features = false, features = ["mutex", "spin_mutex", "once"] }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"

# The profile used for everything that runs on the target: optimised, but with
# debug assertions and overflow checks so kernel bugs reach the panic screen.
[profile.relay]
inherits = "release"
debug = true
debug-assertions = true
overflow-checks = true

# User programs (spec §8.4): the target profile, plus LTO, without debug
# info, since `system.img` holds every program in memory.
[profile.user]
inherits = "relay"
lto = true
strip = "debuginfo"
