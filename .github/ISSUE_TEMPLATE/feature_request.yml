name: Feature request
description: Suggest a feature or a new command
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What do you want to do that you cannot do now?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like Relay OS to do?
    validations:
      required: true
