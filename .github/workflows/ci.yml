# Pull-request gate for main. The steps only install tools; the checks live in
# `cargo xtask` (xtask/src/ci.rs), so a local `cargo xtask ci` runs the same.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt,clippy --target x86_64-unknown-uefi,x86_64-unknown-none
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo xtask lint

  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Every host tool a unit test runs, even those the runner image has:
      # mtools and fdisk (the image), e2fsprogs (ext2), binutils (readelf)
      # and linux-libc-dev (Linux's error numbers).
      - name: Install the tools the unit tests run
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mtools fdisk e2fsprogs binutils linux-libc-dev
      # The tests of `test` run GNU's test as root through `unshare -r`;
      # Ubuntu 24.04 lets AppArmor refuse an unprivileged user namespace.
      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Install the pinned toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt,clippy --target x86_64-unknown-uefi,x86_64-unknown-none
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo xtask unit

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install QEMU, OVMF, disk tools and readelf
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 ovmf mtools e2fsprogs fdisk binutils
      - name: Enable KVM, or fall back to software emulation
        run: |
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
          else
            echo "RELAY_QEMU_ACCEL=tcg" >> "$GITHUB_ENV"
          fi
      - name: Install the pinned toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt,clippy --target x86_64-unknown-uefi,x86_64-unknown-none
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo xtask test --e2e-only
      - name: Keep serial logs and screenshots
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-logs
          path: target/relay/e2e/
          if-no-files-found: ignore
