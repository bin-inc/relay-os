name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  targets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.98.1
          targets: x86_64-unknown-uefi, x86_64-unknown-none
      - run: cargo build -p relay-loader --target x86_64-unknown-uefi --locked
      - run: cargo build -p relay-kernel --target x86_64-unknown-none --locked

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.98.1
      - name: Cache supply-chain tools
        id: cargo-tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/cargo-deny
            ~/.cargo/bin/cargo-audit
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
          key: cargo-tools-v1-${{ runner.os }}-${{ runner.arch }}-deny-0.20.2-audit-0.22.2
      - if: steps.cargo-tools.outputs.cache-hit != 'true'
        run: cargo install --locked cargo-deny --version 0.20.2
      - if: steps.cargo-tools.outputs.cache-hit != 'true'
        run: cargo install --locked cargo-audit --version 0.22.2
      - run: cargo metadata --locked --format-version 1 --no-deps > /dev/null
      - run: cargo deny check advisories bans licenses sources
      - run: cargo audit --file Cargo.lock
