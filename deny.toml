[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "ISC",
    "MPL-2.0",
    "Unicode-3.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "deny"
wildcards = "deny"
highlight = "all"
skip = [
    { crate = "bitflags@1.3.2", reason = "fatfs 0.3.6 requires bitflags 1 while the target-side crates require bitflags 2" },
    { crate = "getrandom@0.2.17", reason = "ovmf-prebuilt 0.2.9 transitively requires ring 0.17" },
    { crate = "syn@2.0.119", reason = "uefi 0.40.0 requires syn 2" },
    { crate = "syn@3.0.5", reason = "uefi 0.40.0 requires syn 3" },
    { crate = "windows-sys@0.52.0", reason = "ovmf-prebuilt 0.2.9 transitively requires ring 0.17" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
